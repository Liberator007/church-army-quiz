<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бланк ответов</title>
  <!-- Бланки для печати: 6 штук на листе A4 (2 × 3, каждый 105 × 99 мм), между ними линии для разрезания.
       Строки строятся из js/data.js: у вопроса с вариантами — кружки 1–4, без вариантов — линия для ответа.
       Печать: Ctrl+P, A4, поля «Нет». -->
  <style>
    @font-face {
      font-family: "Onest";
      src: url("assets/fonts/onest-cyrillic-wght-normal.woff2") format("woff2-variations");
      font-weight: 100 900;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Onest";
      src: url("assets/fonts/onest-latin-wght-normal.woff2") format("woff2-variations");
      font-weight: 100 900;
      unicode-range: U+0000-00FF, U+2000-206F;
    }
    @page { size: A4 portrait; margin: 0; }
    :root {
      --ink: #1d2112;
      --muted: #77765c;
      --line: #d3cfba;
      --cut: #9c9a84;
      --accent: #5b6b26;
      --f: "Onest", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #d9d4c0; font-family: var(--f); color: var(--ink); }
    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 10mm auto;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @media print {
      html, body { background: #fff; }
      .sheet { margin: 0; }
    }

    /* Один бланк; пунктир — линии разреза */
    .blank { padding: 6mm 6mm 5mm; display: flex; flex-direction: column; min-height: 0; }
    .blank:nth-child(odd) { border-right: 0.25mm dashed var(--cut); }
    .blank:nth-child(-n+4) { border-bottom: 0.25mm dashed var(--cut); }

    header { display: flex; align-items: flex-end; gap: 4mm; padding-bottom: 2mm; border-bottom: 0.4mm solid var(--ink); }
    .title { font: 800 3.6mm/1 var(--f); text-transform: uppercase; letter-spacing: -0.01em; white-space: nowrap; }
    .kicker { font: 700 1.9mm/1 var(--f); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2mm; }
    .name { flex: 1; display: flex; align-items: flex-end; gap: 1.5mm; font: 600 2.8mm/1 var(--f); }
    .name span { flex: 1; border-bottom: 0.25mm solid var(--ink); height: 6mm; }

    .hint { margin: 1.6mm 0 0; font: 400 2.1mm/1.25 var(--f); color: var(--muted); }

    .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 5mm; margin-top: 1mm; }
    .col { display: grid; grid-template-rows: repeat(8, 1fr); }
    .row { display: flex; align-items: center; gap: 1.8mm; border-bottom: 0.2mm solid var(--line); }
    .num { width: 7.5mm; flex: none; font: 800 3.6mm/1 var(--f); font-variant-numeric: tabular-nums; }
    .opts { display: flex; gap: 1.6mm; }
    .opts i {
      width: 6mm;
      height: 6mm;
      border: 0.25mm solid var(--ink);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 500 2.8mm/1 var(--f);
      font-style: normal;
      color: var(--muted);
    }
    .write { flex: 1; height: 5.5mm; border-bottom: 0.25mm solid var(--ink); margin-right: 1mm; }
    .spare .num { color: var(--muted); }
    .spare small { display: block; font: 600 1.4mm/1 var(--f); letter-spacing: .04em; text-transform: uppercase; margin-top: 0.6mm; }
  </style>
</head>
<body>
  <div class="sheet"></div>

  <script src="js/data.js"></script>
  <script>
    (() => {
      const Q = window.QUIZ;
      const PER_SHEET = 6;
      const PER_COL = 8;
      const qs = Q.questions;
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      // всегда целые колонки по 8 строк; лишние строки — для запасного вопроса
      const total = Math.max(PER_COL * 2, Math.ceil(qs.length / PER_COL) * PER_COL);
      const circles = (n) => Array.from({ length: n }, (_, d) => `<i>${d + 1}</i>`).join("");
      const row = (k) => {
        const q = qs[k];
        const n = k + 1;
        if (!q) return `<div class="row spare"><div class="num">${n}<small>запасной</small></div><div class="opts">${circles(4)}</div></div>`;
        const body = q.options ? `<div class="opts">${circles(q.options.length)}</div>` : `<div class="write"></div>`;
        return `<div class="row"><div class="num">${n}</div>${body}</div>`;
      };
      const cols = Array.from({ length: total / PER_COL }, (_, c) =>
        `<div class="col">${Array.from({ length: PER_COL }, (_, r) => row(c * PER_COL + r)).join("")}</div>`).join("");
      const written = qs.map((q, k) => (q.options ? null : k + 1)).filter(Boolean);
      const hint = "Обведите номер правильного варианта." +
        (written.length ? ` В ${written.length > 1 ? "вопросах" : "вопросе"} ${written.join(" и ")} впишите ответ.` : "");
      const blank = `
        <div class="blank">
          <header>
            <div>
              <div class="kicker">Бланк ответов</div>
              <div class="title">${esc(Q.title)}</div>
            </div>
            <div class="name">Имя <span></span></div>
          </header>
          <p class="hint">${esc(hint)}</p>
          <div class="cols">${cols}</div>
        </div>`;
      document.querySelector(".sheet").innerHTML = blank.repeat(PER_SHEET);
    })();
  </script>
</body>
</html>
