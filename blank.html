<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бланк ответов</title>
  <!-- Бланк для печати (A4). Строки строятся из js/data.js: у вопроса с вариантами —
       кружки 1–4, без вариантов — линия для ответа. Печать: Ctrl+P. -->
  <style>
    @font-face {
      font-family: "Onest";
      src: url("assets/fonts/onest-cyrillic-wght-normal.woff2") format("woff2-variations");
      font-weight: 100 900;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Onest";
      src: url("assets/fonts/onest-latin-wght-normal.woff2") format("woff2-variations");
      font-weight: 100 900;
      unicode-range: U+0000-00FF, U+2000-206F;
    }
    @page { size: A4 portrait; margin: 0; }
    :root {
      --ink: #1d2112;
      --muted: #77765c;
      --line: #c9c4ac;
      --accent: #5b6b26;
      --f: "Onest", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #d9d4c0; font-family: "Onest", "Segoe UI", sans-serif; color: var(--ink); }
    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 10mm auto;
      padding: 14mm 14mm 12mm;
      background: #fff;
      display: flex;
      flex-direction: column;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @media print {
      html, body { background: #fff; }
      .sheet { margin: 0; }
    }

    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10mm; padding-bottom: 5mm; border-bottom: 0.6mm solid var(--ink); }
    .title { font: 800 9mm/1 var(--f); text-transform: uppercase; letter-spacing: -0.02em; }
    .kicker { font: 700 3mm/1 var(--f); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 2.5mm; }
    .name { flex: 1; max-width: 95mm; display: flex; align-items: flex-end; gap: 3mm; font: 600 4.5mm/1 var(--f); }
    .name span { flex: 1; border-bottom: 0.3mm solid var(--ink); height: 9mm; }

    .hint { margin: 4mm 0 0; font: 400 3.4mm/1.3 var(--f); color: var(--muted); }

    .cols { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10mm; margin-top: 3mm; }
    .col { display: grid; grid-template-rows: repeat(8, 1fr); }
    .row { display: flex; align-items: center; gap: 5mm; border-bottom: 0.25mm solid var(--line); }
    .num { width: 14mm; flex: none; font: 800 7.5mm/1 var(--f); font-variant-numeric: tabular-nums; }
    .opts { display: flex; gap: 3.5mm; }
    .opts i {
      width: 11mm;
      height: 11mm;
      border: 0.35mm solid var(--ink);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 500 5mm/1 var(--f);
      font-style: normal;
      color: var(--muted);
    }
    .write { flex: 1; height: 11mm; border-bottom: 0.35mm solid var(--ink); margin-right: 2mm; }
    .spare .num { color: var(--muted); }
    .spare small { display: block; font: 600 2.4mm/1 var(--f); letter-spacing: .08em; text-transform: uppercase; margin-top: 1mm; }
  </style>
</head>
<body>
  <div class="sheet">
    <header>
      <div>
        <div class="kicker">Бланк ответов</div>
        <div class="title"></div>
      </div>
      <div class="name">Имя <span></span></div>
    </header>
    <p class="hint"></p>
    <div class="cols"></div>
  </div>

  <script src="js/data.js"></script>
  <script>
    (() => {
      const Q = window.QUIZ;
      const PER_COL = 8;
      const qs = Q.questions;
      // всегда целые колонки по 8 строк; лишние строки — для запасного вопроса
      const total = Math.max(PER_COL * 2, Math.ceil(qs.length / PER_COL) * PER_COL);
      const row = (k) => {
        const q = qs[k];
        const n = k + 1;
        if (!q) return `<div class="row spare"><div class="num">${n}<small>запасной</small></div><div class="opts">${[1, 2, 3, 4].map((d) => `<i>${d}</i>`).join("")}</div></div>`;
        const body = q.options
          ? `<div class="opts">${q.options.map((_, d) => `<i>${d + 1}</i>`).join("")}</div>`
          : `<div class="write"></div>`;
        return `<div class="row"><div class="num">${n}</div>${body}</div>`;
      };
      const cols = [];
      for (let c = 0; c < total / PER_COL; c++) {
        cols.push(`<div class="col">${Array.from({ length: PER_COL }, (_, r) => row(c * PER_COL + r)).join("")}</div>`);
      }
      document.querySelector(".cols").innerHTML = cols.join("");
      document.querySelector(".title").textContent = Q.title;
      const written = qs.map((q, k) => (q.options ? null : k + 1)).filter(Boolean);
      document.querySelector(".hint").textContent = "Обведите номер правильного варианта." +
        (written.length ? ` В ${written.length > 1 ? "вопросах" : "вопросе"} ${written.join(" и ")} впишите ответ словами.` : "");
    })();
  </script>
</body>
</html>
